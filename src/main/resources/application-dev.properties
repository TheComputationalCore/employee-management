# =========================================================
# application-dev.properties (LOCAL / DEV)
# =========================================================

# ---------------------------------------------------------
# Datasource (H2 for local development)
# ---------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:empmgmtdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=MONTH,YEAR
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---------------------------------------------------------
# Hikari (small & safe)
# ---------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# ---------------------------------------------------------
# JPA / Hibernate (LOCAL H2 ONLY)
# ---------------------------------------------------------
# Create/update the throwaway in-memory schema for the demo profile.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------------------------------------------------------
# Flyway is disabled because the current migration set does not define
# the complete entity schema used by the local demo.
# ---------------------------------------------------------
spring.flyway.enabled=false

# ---------------------------------------------------------
# Actuator (dev)
# ---------------------------------------------------------
management.endpoints.web.exposure.include=health,info
