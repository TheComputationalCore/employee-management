<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/main}">

<body>

<main layout:fragment="content" class="p-4">

    <h2>Add New KPI</h2>

    <form method="post">

        <div class="mb-3">
            <label>Name</label>
            <input class="form-control" name="name" required>
        </div>

        <div class="mb-3">
            <label>Description</label>
            <textarea class="form-control" name="description"></textarea>
        </div>

        <div class="mb-3">
            <label>Weight (%)</label>
            <input class="form-control" type="number" name="weight" min="1" max="100" required>
        </div>

        <button class="btn btn-primary">Save KPI</button>

    </form>

</main>

</body>
</html>
