<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Set up your account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 560px">
    <section class="card shadow-sm border-0">
        <div class="card-body p-4 p-md-5">
            <h1 class="h3 mb-2">Set up your account</h1>
            <p class="text-secondary mb-4">Enter the username and one-time code provided by HR. The code expires after 24 hours.</p>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <form th:action="@{/account/setup}" method="post" autocomplete="off">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input id="username" name="username" class="form-control" required maxlength="100" th:value="${username}">
                </div>
                <div class="mb-3">
                    <label for="setupCode" class="form-label">One-time setup code</label>
                    <input id="setupCode" name="setupCode" class="form-control" required maxlength="100" autocomplete="one-time-code" th:value="${setupCode}">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">New password</label>
                    <input id="password" name="password" type="password" class="form-control" required minlength="12" maxlength="72" autocomplete="new-password">
                </div>
                <div class="mb-4">
                    <label for="confirmPassword" class="form-label">Confirm password</label>
                    <input id="confirmPassword" name="confirmPassword" type="password" class="form-control" required minlength="12" maxlength="72" autocomplete="new-password">
                </div>
                <button class="btn btn-primary w-100" type="submit">Set password</button>
            </form>
        </div>
    </section>
</main>
</body>
</html>
